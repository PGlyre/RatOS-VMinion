# ==================================================================================================
# === FILE: printer.cfg
# === PRINTER: RatOS Printer 3
# === SYSTEM: RatOS 2.1 / Klipper
# === VERSION: v1.0 clean
# === PURPOSE: Main Klipper printer configuration with RatOS includes and local printer overrides
# === NOTES:
# ===   - Cleaned structure only; active values are preserved from the supplied file.
# ===   - This printer is treated as sensitive: no tuning values were intentionally changed.
# ===   - RatOS defaults are loaded first. Printer-specific sections below override RatOS defaults.
# ===   - Keep local custom files in PGe-Klipper/ when possible.
# ==================================================================================================


# ==================================================================================================
# === SECTION: RATOS BASE INCLUDES
# === RatOS base configuration and shared defaults.
# ==================================================================================================
[include RatOS.cfg]
[include shell_command.cfg]

# ==================================================================================================
# === SECTION: PGE CUSTOM INCLUDES
# === Local add-ons and printer-specific macro/sensor files.
# ==================================================================================================
[include PGe-Klipper/filament_sensor.cfg]
[include PGe-Klipper/spoolman.cfg]
[include PGe-Klipper/custom_macros.cfg]
[include macro_search_vars.cfg]
[include klipper_backup.cfg]

# ==================================================================================================
# === SECTION: OPTIONAL / DISABLED INCLUDES
# === Leave commented unless you intentionally want to enable a known file.
# ==================================================================================================
#[include PGe-Klipper/xxx.cfg]
#[include PGe-Klipper/xxx]
#[include PGe-Klipper/xxx]

# ==================================================================================================
# === SECTION: RATOS GLOBAL SETTINGS
# === Global RatOS behavior switches.
# ==================================================================================================
[ratos]
#allow_unsupported_slicer_versions: True

# ==================================================================================================
# === SECTION: KLIPPER MOTION HELPERS
# === Arc support used by slicers that output G2/G3 moves.
# ==================================================================================================
[gcode_arcs]
resolution: 0.1

# ==================================================================================================
# === SECTION: MOTION - X AXIS
# === X motor / carriage movement overrides.
# ==================================================================================================
[stepper_x]
dir_pin: !x_dir_pin
rotation_distance: 40
homing_speed: 50
position_min: 0
position_max: 180
position_endstop: 0

# ==================================================================================================
# === SECTION: MOTION - Y AXIS
# === Y motor / bed or gantry movement overrides.
# ==================================================================================================
[stepper_y]
dir_pin: y_dir_pin
rotation_distance: 40
homing_speed: 50
position_min: 0
position_max: 180
position_endstop: 0

# ==================================================================================================
# === SECTION: MOTION - Z AXIS
# === Z movement overrides. Negative min allows probe/nozzle calibration room.
# ==================================================================================================
[stepper_z]
dir_pin: !z0_dir_pin
rotation_distance: 4
homing_speed: 10
position_min: -5
position_max: 180

# ==================================================================================================
# === SECTION: EXTRUDER
# === Extruder motor direction and rotation distance.
# ==================================================================================================
[extruder]
dir_pin: !e_dir_pin
rotation_distance: 5.57
#pressure_advance: 0.05

# ==================================================================================================
# === SECTION: HEATED BED
# === Active bed section is kept so SAVE_CONFIG PID data can bind cleanly.
# ==================================================================================================
[heater_bed]

# ==================================================================================================
# === SECTION: PROBE
# === Probe input and Z-offset. z_offset is normally updated by PROBE_CALIBRATE + SAVE_CONFIG.
# ==================================================================================================
[probe]
z_offset: 0.0
pin: ^probe_pin
#pin: ^!probe_pin  # NPN NO probe type
#pin: probe_pin    # PNP NO probe type
#pin: !probe_pin   # PNP NC probe type

# ==================================================================================================
# === SECTION: FANS - DISABLED EXAMPLES
# === These are kept as reference only. Enable only after verifying board pins.
# ==================================================================================================
# Part cooling fan
#[fan]
#pin: PA8
#cycle_time: 0.00004

# Hotend cooling fan
#[heater_fan toolhead_cooling_fan]
#heater: extruder
#pin: PE5

# Controller cooling fan
#[controller_fan controller_fan]
#pin: PD12

# ==================================================================================================
# === SECTION: LED CONTROL
# === Main neopixel strip and GPIO-controlled LED output.
# ==================================================================================================
[neopixel LEDlight]
pin: PE4
chain_count: 64
color_order: GRBW
initial_RED: 0.2
initial_GREEN: 0.2
initial_BLUE: 0.2
initial_WHITE: 0.2

[output_pin LEDlight]
pin: rpi:gpio26
pwm: false
value: 1
shutdown_value: 1
#max_power: 1
#shutdown_speed: 0
#kick_start_time: 0.1
#off_below: 0.10

[gcode_macro LEDlight]
gcode:
    SET_PIN PIN=LEDlight VALUE=0
    G4 P800
    SET_PIN PIN=LEDlight VALUE=1

# ==================================================================================================
# === SECTION: TEMPERATURE / CONTROLLER FAN
# === Raspberry Pi / host-temperature controlled electronics fan.
# ==================================================================================================
[temperature_fan controller_fan]
pin: PD12
kick_start_time: 0.5
shutdown_speed: 0
sensor_type: temperature_host
control: pid
min_temp: 0
max_temp: 100
pid_kp: 1.0
pid_ki: 0.5
pid_kd: 2.0
pid_deriv_time: 2.0
min_speed: 0.1
max_speed: 1.0
target_temp: 45

# ==================================================================================================
# === SECTION: KLIPPER HELPERS
# === Common helper modules used by slicers, macros and UI features.
# ==================================================================================================
[exclude_object]

[pause_resume]
recover_velocity: 50

[skew_correction]

